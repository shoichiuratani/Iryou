<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Surgi-Motion Visualizer - Enhanced ROI Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            height: calc(100vh - 160px);
        }

        .video-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .video-container {
            position: relative;
            flex: 1;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #videoCanvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            display: block;
        }

        .video-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn.danger {
            background: #dc3545;
        }

        .btn.danger:hover {
            background: #c82333;
        }

        .btn.success {
            background: #28a745;
        }

        .btn.success:hover {
            background: #218838;
        }

        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #007bff;
        }

        .section h3 {
            color: #007bff;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: rgba(0, 123, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #0056b3;
            background: rgba(0, 123, 255, 0.2);
        }

        .upload-area.dragover {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.2);
        }

        .roi-tools {
            display: none;
        }

        .roi-tools.active {
            display: block;
        }

        .roi-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .roi-type-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .roi-type-btn.active {
            border-color: #007bff;
            background: #e7f3ff;
            color: #007bff;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.idle { background: #6c757d; }
        .status-indicator.processing { background: #ffc107; animation: pulse 2s infinite; }
        .status-indicator.success { background: #28a745; }
        .status-indicator.error { background: #dc3545; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #0056b3);
            transition: width 0.3s ease;
            width: 0%;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }

        .info-item {
            background: white;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #6c757d;
            display: block;
        }

        .info-value {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .instrument-list {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border-radius: 5px;
            padding: 10px;
        }

        .instrument-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .instrument-item:last-child {
            border-bottom: none;
        }

        .confidence-bar {
            width: 60px;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc3545, #ffc107, #28a745);
        }

        .export-options {
            display: none;
        }

        .export-options.active {
            display: block;
        }

        .roi-coordinates {
            background: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
        }

        #fileInput {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success { background: #28a745; }
        .notification.error { background: #dc3545; }
        .notification.info { background: #17a2b8; }
        .notification.warning { background: #ffc107; color: #333; }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: 2fr 1fr;
            }
            
            .control-panel {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Surgi-Motion Visualizer</h1>
            <h2>Enhanced SAM2 ROI Tracking System</h2>
        </div>

        <div class="main-content">
            <!-- Video Panel -->
            <div class="video-panel">
                <div class="video-container">
                    <canvas id="videoCanvas"></canvas>
                </div>
                
                <div class="video-controls">
                    <button class="btn" onclick="uploadVideo()">📁 動画選択</button>
                    <button class="btn" id="playPauseBtn" onclick="togglePlayPause()" disabled>▶️ 再生</button>
                    <button class="btn" onclick="resetROI()" disabled id="resetROIBtn">🔄 ROIリセット</button>
                    <button class="btn danger" onclick="clearAll()">🗑️ クリア</button>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Upload Section -->
                <div class="section">
                    <h3>📤 動画アップロード</h3>
                    <div class="upload-area" onclick="uploadVideo()" id="uploadArea">
                        <div>📁 クリックまたはドラッグ&ドロップで動画を選択</div>
                        <div style="font-size: 12px; color: #6c757d; margin-top: 5px;">
                            対応形式: MP4, AVI, MOV, MKV, WMV (最大: 1GB)
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept="video/*" onchange="handleFileSelect(event)">
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">状態</span>
                            <span class="info-value" id="uploadStatus">
                                <span class="status-indicator idle"></span>未選択
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ファイルサイズ</span>
                            <span class="info-value" id="fileSize">-</span>
                        </div>
                    </div>
                </div>

                <!-- ROI Selection Section -->
                <div class="section roi-tools" id="roiSection">
                    <h3>🎯 ROI選択</h3>
                    
                    <div class="roi-type-selector">
                        <button class="roi-type-btn active" onclick="setROIType('polygon')" data-type="polygon">
                            📐 ポリゴン
                        </button>
                        <button class="roi-type-btn" onclick="setROIType('rectangle')" data-type="rectangle">
                            ⬜ 矩形
                        </button>
                        <button class="roi-type-btn" onclick="setROIType('rotated_rectangle')" data-type="rotated_rectangle">
                            🔄 回転矩形
                        </button>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <button class="btn success" onclick="confirmROI()" id="confirmROIBtn" disabled>
                            ✅ ROI確定
                        </button>
                        <button class="btn" onclick="undoLastPoint()" id="undoBtn" disabled>
                            ↶ 点を削除
                        </button>
                    </div>

                    <div class="roi-coordinates" id="roiCoordinates">
                        座標: 未設定
                    </div>
                </div>

                <!-- Tracking Section -->
                <div class="section" id="trackingSection" style="display: none;">
                    <h3>🔍 トラッキング</h3>
                    
                    <button class="btn success" onclick="startTracking()" id="startTrackingBtn">
                        🚀 トラッキング開始
                    </button>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">進行状況</span>
                            <span class="info-value" id="trackingProgress">0%</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">処理済みフレーム</span>
                            <span class="info-value" id="processedFrames">0</span>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="section" id="resultsSection" style="display: none;">
                    <h3>📊 検出結果</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">検出器具数</span>
                            <span class="info-value" id="instrumentCount">0</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ROI面積</span>
                            <span class="info-value" id="roiArea">0px²</span>
                        </div>
                    </div>

                    <div class="instrument-list" id="instrumentList">
                        <!-- Instruments will be populated here -->
                    </div>
                </div>

                <!-- Export Section -->
                <div class="section export-options" id="exportSection">
                    <h3>📥 データエクスポート</h3>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button class="btn" onclick="exportResults('json')">📄 JSON</button>
                        <button class="btn" onclick="exportResults('csv')">📊 CSV</button>
                        <button class="btn" onclick="exportResults('excel')">📈 Excel</button>
                    </div>
                    
                    <div id="exportStatus"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentSession = null;
        let canvas = null;
        let ctx = null;
        let video = null;
        let roiPoints = [];
        let currentROIType = 'polygon';
        let isDrawing = false;
        let trackingInterval = null;

        // API Configuration
        const API_BASE = 'https://8000-ifsp0ufrb6mp7lags2c00-6532622b.e2b.dev';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeCanvas();
            setupDragAndDrop();
        });

        function initializeCanvas() {
            canvas = document.getElementById('videoCanvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = 800;
            canvas.height = 450;
            
            // Add event listeners
            canvas.addEventListener('click', handleCanvasClick);
            canvas.addEventListener('mousemove', handleCanvasMouseMove);
            
            // Draw initial state
            drawCanvas();
        }

        function setupDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
        }

        function uploadVideo() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        async function handleFile(file) {
            try {
                showNotification('動画アップロード中...', 'info');
                updateUploadStatus('processing', 'アップロード中');
                
                // Update file size display
                document.getElementById('fileSize').textContent = formatFileSize(file.size);
                
                // Create form data
                const formData = new FormData();
                formData.append('file', file);
                
                // Upload file
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`Upload failed: ${response.statusText}`);
                }
                
                const result = await response.json();
                currentSession = result.session_id;
                
                // Load video for display
                await loadVideo(file);
                
                // Create tracking session
                await createTrackingSession(currentSession);
                
                updateUploadStatus('success', 'アップロード完了');
                document.getElementById('roiSection').classList.add('active');
                
                showNotification('動画アップロード完了！ROIを選択してください。', 'success');
                
            } catch (error) {
                console.error('Upload error:', error);
                updateUploadStatus('error', 'エラー');
                showNotification(`アップロードエラー: ${error.message}`, 'error');
            }
        }

        function loadVideo(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                video = document.createElement('video');
                
                video.onloadeddata = () => {
                    // Set canvas size to match video
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Draw first frame
                    ctx.drawImage(video, 0, 0);
                    
                    // Enable play button
                    document.getElementById('playPauseBtn').disabled = false;
                    
                    URL.revokeObjectURL(url);
                    resolve();
                };
                
                video.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Failed to load video'));
                };
                
                video.src = url;
                video.load();
            });
        }

        async function createTrackingSession(sessionId) {
            try {
                const response = await fetch(`${API_BASE}/api/sessions?session_id=${sessionId}`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to create tracking session');
                }
                
                const result = await response.json();
                console.log('Tracking session created:', result);
                
            } catch (error) {
                console.error('Session creation error:', error);
                throw error;
            }
        }

        function setROIType(type) {
            currentROIType = type;
            roiPoints = [];
            
            // Update button states
            document.querySelectorAll('.roi-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            
            updateROIDisplay();
            drawCanvas();
        }

        function handleCanvasClick(event) {
            if (!video) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * (canvas.width / rect.width);
            const y = (event.clientY - rect.top) * (canvas.height / rect.height);
            
            if (currentROIType === 'polygon') {
                roiPoints.push([x, y]);
            } else if (currentROIType === 'rectangle') {
                if (roiPoints.length === 0) {
                    roiPoints.push([x, y]);
                } else if (roiPoints.length === 1) {
                    roiPoints.push([x, y]);
                } else {
                    // Replace second point
                    roiPoints[1] = [x, y];
                }
            } else if (currentROIType === 'rotated_rectangle') {
                roiPoints.push([x, y]);
                if (roiPoints.length > 4) {
                    roiPoints = roiPoints.slice(-4); // Keep only last 4 points
                }
            }
            
            updateROIDisplay();
            drawCanvas();
            
            // Enable/disable buttons
            document.getElementById('undoBtn').disabled = roiPoints.length === 0;
            document.getElementById('confirmROIBtn').disabled = !isROIComplete();
        }

        function handleCanvasMouseMove(event) {
            if (!video || !isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) * (canvas.width / rect.width);
            const y = (event.clientY - rect.top) * (canvas.height / rect.height);
            
            // Update preview for rectangle mode
            if (currentROIType === 'rectangle' && roiPoints.length === 1) {
                const tempPoints = [...roiPoints, [x, y]];
                drawCanvas(tempPoints);
            }
        }

        function drawCanvas(previewPoints = null) {
            if (!video) {
                // Draw placeholder
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#6c757d';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('動画を選択してください', canvas.width / 2, canvas.height / 2);
                return;
            }
            
            // Draw video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Draw ROI
            const points = previewPoints || roiPoints;
            if (points.length > 0) {
                drawROI(points);
            }
        }

        function drawROI(points) {
            if (points.length === 0) return;
            
            ctx.strokeStyle = '#007bff';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(0, 123, 255, 0.2)';
            
            ctx.beginPath();
            
            if (currentROIType === 'polygon') {
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                if (points.length > 2) {
                    ctx.closePath();
                    ctx.fill();
                }
            } else if (currentROIType === 'rectangle' && points.length >= 2) {
                const [x1, y1] = points[0];
                const [x2, y2] = points[1];
                const width = x2 - x1;
                const height = y2 - y1;
                ctx.rect(x1, y1, width, height);
                ctx.fill();
            } else if (currentROIType === 'rotated_rectangle' && points.length >= 3) {
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                if (points.length === 4) {
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            ctx.stroke();
            
            // Draw points
            ctx.fillStyle = '#007bff';
            points.forEach(([x, y], index) => {
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fill();
                
                // Draw point number
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText((index + 1).toString(), x, y + 4);
                ctx.fillStyle = '#007bff';
            });
        }

        function isROIComplete() {
            if (currentROIType === 'polygon') {
                return roiPoints.length >= 3;
            } else if (currentROIType === 'rectangle') {
                return roiPoints.length >= 2;
            } else if (currentROIType === 'rotated_rectangle') {
                return roiPoints.length >= 4;
            }
            return false;
        }

        function updateROIDisplay() {
            const coords = roiPoints.map((point, index) => 
                `${index + 1}: (${Math.round(point[0])}, ${Math.round(point[1])})`
            ).join('\n');
            
            document.getElementById('roiCoordinates').textContent = 
                coords || '座標: 未設定';
        }

        function undoLastPoint() {
            if (roiPoints.length > 0) {
                roiPoints.pop();
                updateROIDisplay();
                drawCanvas();
                
                document.getElementById('undoBtn').disabled = roiPoints.length === 0;
                document.getElementById('confirmROIBtn').disabled = !isROIComplete();
            }
        }

        function resetROI() {
            roiPoints = [];
            updateROIDisplay();
            drawCanvas();
            
            document.getElementById('undoBtn').disabled = true;
            document.getElementById('confirmROIBtn').disabled = true;
            document.getElementById('resetROIBtn').disabled = true;
            document.getElementById('trackingSection').style.display = 'none';
        }

        async function confirmROI() {
            if (!currentSession || !isROIComplete()) return;
            
            try {
                showNotification('ROIを確定中...', 'info');
                
                const response = await fetch(`${API_BASE}/api/sessions/${currentSession}/roi`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        points: roiPoints,
                        roi_type: currentROIType
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to set ROI');
                }
                
                const result = await response.json();
                
                // Update UI
                document.getElementById('resetROIBtn').disabled = false;
                document.getElementById('trackingSection').style.display = 'block';
                document.getElementById('resultsSection').style.display = 'block';
                
                // Update results display
                document.getElementById('instrumentCount').textContent = result.instruments_detected;
                document.getElementById('roiArea').textContent = `${result.roi_area}px²`;
                
                updateInstrumentList(result.instrument_types || [], result.confidence_scores || []);
                
                showNotification(`ROI確定完了！${result.instruments_detected}個の器具を検出しました。`, 'success');
                
            } catch (error) {
                console.error('ROI confirmation error:', error);
                showNotification(`ROI確定エラー: ${error.message}`, 'error');
            }
        }

        async function startTracking() {
            if (!currentSession) return;
            
            try {
                showNotification('トラッキング開始...', 'info');
                
                const response = await fetch(`${API_BASE}/api/sessions/${currentSession}/tracking/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        frame_skip: 1,
                        tracking_method: 'sam2'
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to start tracking');
                }
                
                const result = await response.json();
                
                // Start progress monitoring
                startProgressMonitoring();
                
                document.getElementById('startTrackingBtn').disabled = true;
                document.getElementById('startTrackingBtn').textContent = '🔄 処理中...';
                
                showNotification('トラッキング開始！進行状況を監視しています。', 'success');
                
            } catch (error) {
                console.error('Tracking start error:', error);
                showNotification(`トラッキング開始エラー: ${error.message}`, 'error');
            }
        }

        function startProgressMonitoring() {
            trackingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/sessions/${currentSession}/status`);
                    
                    if (!response.ok) return;
                    
                    const status = await response.json();
                    
                    // Update progress
                    const progress = Math.round(status.progress * 100);
                    document.getElementById('trackingProgress').textContent = `${progress}%`;
                    document.getElementById('progressFill').style.width = `${progress}%`;
                    document.getElementById('processedFrames').textContent = status.frames_processed || 0;
                    
                    // Check if completed
                    if (status.status === 'tracking_completed') {
                        clearInterval(trackingInterval);
                        onTrackingCompleted();
                    } else if (status.status === 'tracking_error') {
                        clearInterval(trackingInterval);
                        onTrackingError(status.error);
                    }
                    
                } catch (error) {
                    console.error('Progress monitoring error:', error);
                }
            }, 2000);
        }

        function onTrackingCompleted() {
            document.getElementById('startTrackingBtn').disabled = false;
            document.getElementById('startTrackingBtn').textContent = '✅ 完了';
            document.getElementById('exportSection').classList.add('active');
            
            showNotification('トラッキング完了！結果をエクスポートできます。', 'success');
        }

        function onTrackingError(error) {
            document.getElementById('startTrackingBtn').disabled = false;
            document.getElementById('startTrackingBtn').textContent = '🚀 トラッキング開始';
            
            showNotification(`トラッキングエラー: ${error}`, 'error');
        }

        async function exportResults(format) {
            if (!currentSession) return;
            
            try {
                showNotification(`${format.toUpperCase()}形式でエクスポート中...`, 'info');
                
                const response = await fetch(`${API_BASE}/api/sessions/${currentSession}/export`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        format_type: format
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Export failed');
                }
                
                const result = await response.json();
                
                // Create download link
                const filename = result.filepath.split('/').pop();
                const downloadUrl = `${API_BASE}/api/sessions/${currentSession}/export/${filename}`;
                
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showNotification(`${format.toUpperCase()}ファイルのダウンロードを開始しました。`, 'success');
                
            } catch (error) {
                console.error('Export error:', error);
                showNotification(`エクスポートエラー: ${error.message}`, 'error');
            }
        }

        function updateInstrumentList(types, scores) {
            const container = document.getElementById('instrumentList');
            container.innerHTML = '';
            
            types.forEach((type, index) => {
                const score = scores[index] || 0;
                
                const item = document.createElement('div');
                item.className = 'instrument-item';
                
                item.innerHTML = `
                    <div>
                        <div style="font-weight: bold;">${type}</div>
                        <div style="font-size: 12px; color: #6c757d;">信頼度: ${Math.round(score * 100)}%</div>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${score * 100}%"></div>
                    </div>
                `;
                
                container.appendChild(item);
            });
        }

        function togglePlayPause() {
            if (!video) return;
            
            if (video.paused) {
                video.play();
                document.getElementById('playPauseBtn').textContent = '⏸️ 停止';
                
                // Update canvas during playback
                const updateCanvas = () => {
                    if (!video.paused) {
                        drawCanvas();
                        requestAnimationFrame(updateCanvas);
                    }
                };
                updateCanvas();
                
            } else {
                video.pause();
                document.getElementById('playPauseBtn').textContent = '▶️ 再生';
            }
        }

        function clearAll() {
            if (confirm('すべてのデータをクリアしますか？')) {
                currentSession = null;
                roiPoints = [];
                video = null;
                
                if (trackingInterval) {
                    clearInterval(trackingInterval);
                    trackingInterval = null;
                }
                
                // Reset UI
                document.getElementById('roiSection').classList.remove('active');
                document.getElementById('trackingSection').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'none';
                document.getElementById('exportSection').classList.remove('active');
                
                updateUploadStatus('idle', '未選択');
                document.getElementById('fileSize').textContent = '-';
                document.getElementById('fileInput').value = '';
                
                // Reset buttons
                document.getElementById('playPauseBtn').disabled = true;
                document.getElementById('resetROIBtn').disabled = true;
                document.getElementById('undoBtn').disabled = true;
                document.getElementById('confirmROIBtn').disabled = true;
                
                drawCanvas();
                
                showNotification('すべてのデータをクリアしました。', 'info');
            }
        }

        function updateUploadStatus(status, text) {
            const statusElement = document.getElementById('uploadStatus');
            const indicator = statusElement.querySelector('.status-indicator');
            
            indicator.className = `status-indicator ${status}`;
            statusElement.innerHTML = `<span class="status-indicator ${status}"></span>${text}`;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showNotification(message, type = 'info') {
            // Remove existing notification
            const existing = document.querySelector('.notification');
            if (existing) {
                existing.remove();
            }
            
            // Create new notification
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // Show notification
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            // Hide notification after 4 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 4000);
        }
    </script>
</body>
</html>
